name: Publish images
on:
  # Register the manual workflow on a new repository; push jobs stay disabled.
  push:
    paths:
      - .github/workflows/publish-images.yml
  # Run explicitly after owner authorization. Source push does not publish.
  workflow_dispatch:
    inputs:
      image_tag:
        description: NS8 module semantic version tag
        required: true
        default: 2.8.0-rc.1
        type: string
permissions:
  contents: read
  packages: write
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false
jobs:
  candidate:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Require private build repository
        env:
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: |
          if [[ "$REPOSITORY_PRIVATE" != "true" ]]; then
            echo 'Publication requires the private ns8-vikunja-build repository.' >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7, MIT
      - name: Validate source
        run: python3 tools/validate.py
      - name: Prepare build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y buildah podman
          buildah version
      - name: Build NS8 candidate
        id: build
        env:
          OWNER: ${{ github.repository_owner }}
          REF_NAME: ${{ github.ref_name }}
          IMAGE_TAG_REQUEST: ${{ inputs.image_tag }}
        run: |
          export REPOBASE="ghcr.io/${OWNER,,}/ns8-vikunja-build"
          export IMAGETAG="${IMAGE_TAG_REQUEST:-${REF_NAME//\//-}}"
          [[ "$IMAGETAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]
          bash build-images.sh
          echo "tag=$IMAGETAG" >> "$GITHUB_OUTPUT"
          mkdir -p .local
          buildah push "$REPOBASE/vikunja" "docker-archive:.local/module.tar:$REPOBASE/vikunja:$IMAGETAG"
          buildah push "$REPOBASE/vikunja-postgres:19.0-ns8.1" "docker-archive:.local/postgres.tar:$REPOBASE/vikunja-postgres:19.0-ns8.1"
      - name: Smoke test Vikunja with PostgreSQL 19
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          cleanup() {
            status=$?
            if [[ "$status" != 0 ]]; then
              podman logs --tail 60 vikunja-candidate >&2 || true
              podman logs --tail 60 pg-candidate >&2 || true
            fi
            podman rm --force --volumes vikunja-candidate pg-candidate >/dev/null 2>&1 || true
            podman pod rm --force ns8-vikunja-smoke >/dev/null 2>&1 || true
            exit "$status"
          }
          trap cleanup EXIT
          export POSTGRES_PASSWORD="$(openssl rand -hex 32)"
          export VIKUNJA_SERVICE_SECRET="$(openssl rand -hex 32)"
          export VIKUNJA_DATABASE_PASSWORD="$POSTGRES_PASSWORD"
          podman pod create --name ns8-vikunja-smoke --publish 127.0.0.1:3456:3456
          podman run --detach --pod ns8-vikunja-smoke --name pg-candidate --env POSTGRES_PASSWORD "ghcr.io/${OWNER,,}/ns8-vikunja-build/vikunja-postgres:19.0-ns8.1"
          for i in $(seq 1 40); do
            if podman exec pg-candidate pg_isready -h 127.0.0.1 -U postgres; then break; fi
            sleep 1
          done
          test "$(podman exec pg-candidate psql -U postgres -Atc 'SHOW server_version')" = 19.0
          podman exec pg-candidate createdb -U postgres vikunja
          podman run --detach --pod ns8-vikunja-smoke --name vikunja-candidate \
            --volume vk-test-files:/app/vikunja/files:U \
            --volume "$PWD/.local/ldap-sync-out/vikunja:/app/vikunja/vikunja:ro,Z" \
            --env VIKUNJA_DATABASE_PASSWORD --env VIKUNJA_SERVICE_SECRET \
            --env VIKUNJA_DATABASE_TYPE=postgres --env VIKUNJA_DATABASE_HOST=127.0.0.1:5432 \
            --env VIKUNJA_DATABASE_USER=postgres --env VIKUNJA_DATABASE_DATABASE=vikunja \
            --env VIKUNJA_DATABASE_SSLMODE=disable --env VIKUNJA_MAILER_ENABLED=false \
            --env VIKUNJA_SERVICE_PUBLICURL=http://127.0.0.1:3456 \
            docker.io/vikunja/vikunja:2.8.0
          python3 tools/smoke_postgres_stack.py http://127.0.0.1:3456 create .local/synthetic-stack.json
          python3 tools/smoke_discovery_policy.py http://127.0.0.1:3456 .local/synthetic-stack.json
          python3 tools/smoke.py http://127.0.0.1:3456
          podman restart pg-candidate
          for i in $(seq 1 40); do
            if podman exec pg-candidate pg_isready -h 127.0.0.1 -U postgres; then break; fi
            sleep 1
          done
          podman restart vikunja-candidate
          python3 tools/smoke_postgres_stack.py http://127.0.0.1:3456 verify .local/synthetic-stack.json
          podman exec pg-candidate pg_dump -U postgres --format=c vikunja > .local/postgres-smoke.dump
          podman exec pg-candidate createdb -U postgres restored
          podman exec --interactive pg-candidate pg_restore -U postgres --no-owner --exit-on-error -d restored < .local/postgres-smoke.dump
          test "$(podman exec pg-candidate psql -U postgres -d restored -Atc 'SELECT count(*) FROM tasks')" = 1
      - name: Scan module archive
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0, Apache-2.0
        with:
          input: .local/module.tar
          version: v0.70.0
          severity: HIGH,CRITICAL
          exit-code: '1'
      - name: Scan Vikunja runtime
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: docker.io/vikunja/vikunja:2.8.0
          version: v0.70.0
          severity: HIGH,CRITICAL
          exit-code: '1'
      - name: Scan PostgreSQL runtime
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          input: .local/postgres.tar
          version: v0.70.0
          severity: HIGH,CRITICAL
          exit-code: '1'
      - name: Require private package before publication
        env:
          OWNER: ${{ github.repository_owner }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 tools/registry_visibility.py "$OWNER" --allow-absent
          python3 tools/registry_visibility.py "$OWNER" --package vikunja-postgres --allow-absent
      - name: Publish scanned candidate
        env:
          OWNER: ${{ github.repository_owner }}
          ACTOR: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_TAG: ${{ steps.build.outputs.tag }}
        run: |
          trap 'buildah logout ghcr.io' EXIT
          printf '%s' "$REGISTRY_TOKEN" | buildah login --username "$ACTOR" --password-stdin ghcr.io
          image="ghcr.io/${OWNER,,}/ns8-vikunja-build/vikunja"
          database="ghcr.io/${OWNER,,}/ns8-vikunja-build/vikunja-postgres:19.0-ns8.1"
          buildah push --digestfile .local/postgres.digest "$database" "docker://$database"
          buildah push --digestfile .local/module.digest "$image" "docker://$image:$IMAGE_TAG"
          printf 'Candidate: `%s:%s`\n\nDigest: `%s`\n' "$image" "$IMAGE_TAG" "$(cat .local/module.digest)" >> "$GITHUB_STEP_SUMMARY"
          printf '\nDatabase: `%s`\n\nDigest: `%s`\n' "$database" "$(cat .local/postgres.digest)" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify published package remains private
        env:
          OWNER: ${{ github.repository_owner }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_TAG: ${{ steps.build.outputs.tag }}
        run: |
          status=0
          python3 tools/registry_visibility.py "$OWNER" --withdraw-public --tag "$IMAGE_TAG" || status=1
          python3 tools/registry_visibility.py "$OWNER" --package vikunja-postgres --withdraw-public || status=1
          exit "$status"
